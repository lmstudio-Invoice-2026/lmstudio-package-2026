<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LM STUDIO Website Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap">
<style>
/* Layout: top action bar, left tab rail, centre form, right live preview. */
:root{
  --ink:#1a1917;--ink-2:#55514b;--muted:#8d877e;--bg:#f6f3ee;--card:#ffffff;--line:#e3ddd3;--gold:#cf9d95;--gold-soft:#f8e6e2;--ok:#2f7d4f;--warn:#b5651d;--bad:#b23a2a;
  --f:"Jost","Noto Sans Myanmar","Noto Sans Thai","Noto Sans SC",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.miss{background:#fde9e6;border-bottom:1px solid #f0c4bd;color:#7a2f25;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.miss b{font-weight:600}
.miss details{flex-basis:100%;font-size:12px}
.miss details code{display:inline-block;margin:2px 6px 0 0;background:#fff;padding:1px 6px;border-radius:4px}
img.broken{visibility:hidden}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--ink);color:#fff}
.top h1{font-size:15px;font-weight:600;letter-spacing:.08em;margin:0 12px 0 0;white-space:nowrap}
.top h1 small{font-weight:400;opacity:.6;letter-spacing:0;margin-left:6px}
.status{font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.12)}
.status.dirty{background:#7a4b10}.status.saved{background:#245e3c}
.spacer{flex:1}
.b{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:6px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.b:hover{border-color:var(--ink)}
.b.gold{background:var(--gold);border-color:var(--gold);font-weight:600;color:#fff}
.b.dark{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.b.dark:hover{border-color:#fff}
.b.sm{padding:3px 9px;font-size:12px}
.b.danger{color:var(--bad)}
.b:disabled{opacity:.45;cursor:not-allowed}
.top select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 8px}
.top select option{color:var(--ink)}
.main{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,46%);min-height:0}
.main.nopv{grid-template-columns:200px minmax(0,1fr) 0}
.rail{border-right:1px solid var(--line);background:var(--card);padding:12px 8px;overflow-y:auto}
.rail button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:6px;margin-bottom:2px}
.rail button small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.rail button[aria-current="true"]{background:var(--gold-soft);font-weight:600}
.panel{overflow-y:auto;padding:20px clamp(16px,2.4vw,32px) 80px;min-width:0}
.panel h2{font-size:20px;margin:0 0 4px}
.panel .lead{color:var(--ink-2);margin:0 0 18px;max-width:70ch}
.group{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.group > h3{font-size:14px;margin:0 0 12px;letter-spacing:.04em}
.row{padding:10px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row > label,.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.row > label code,.lbl code{font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.lf{display:flex;flex-direction:column;gap:2px;min-width:0}
.lf span{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.lf span.missing{color:var(--warn)}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=email],textarea,select.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.slot .th{aspect-ratio:4/3;background:#ece7df}
.slot .th img{width:100%;height:100%;object-fit:cover;display:block}
.slot .info{padding:10px;display:flex;flex-direction:column;gap:6px}
.slot .info b{font-size:13px}
.slot .info small{color:var(--muted);font-size:11.5px;line-height:1.4}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.ph{position:relative;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#ece7df}
.ph.cover{border-color:var(--gold)}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:2px;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.ph .tools button{border:0;background:rgba(255,255,255,.92);border-radius:4px;font-size:11px;padding:2px 6px}
.ph .badge{position:absolute;top:4px;left:4px;background:var(--gold);font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px}
.ph.add{display:grid;place-items:center;aspect-ratio:1;border:2px dashed var(--line);background:#fff;color:var(--ink-2);font-size:12.5px;text-align:center;padding:8px}
.ph.add:hover{border-color:var(--gold)}
.item-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.item-head .thumb{width:64px;height:48px;border-radius:6px;overflow:hidden;background:#ece7df;flex:none}
.item-head .thumb img{width:100%;height:100%;object-fit:cover}
.item-head b{flex:1;min-width:140px}
details.group > summary{cursor:pointer;list-style:none}
details.group > summary::-webkit-details-marker{display:none}
details.group[open] > summary{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.preview{border-left:1px solid var(--line);background:#ddd;min-width:0;display:flex;flex-direction:column}
.preview .pv-bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.preview iframe{flex:1;border:0;width:100%;background:#fff}
.main.nopv .preview{display:none}
.help ol{padding-left:20px}.help li{margin-bottom:10px}
.help .note{background:var(--gold-soft);border-radius:8px;padding:12px 14px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9;max-width:90vw}
.toast.bad{background:var(--bad)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--bad)}
@media (max-width:1100px){.main{grid-template-columns:170px minmax(0,1fr)}.preview{display:none}#pvToggle{display:none}}
@media (max-width:640px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.rail{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}.rail button{width:auto;white-space:nowrap}.rail button small{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>LM STUDIO <small>Website Editor · ပြင်ဆင်ရန်</small></h1>
    <span class="status" id="status">ပြင်ဆင်မှု မရှိသေး</span>
    <span class="spacer"></span>
    <label style="font-size:12px;opacity:.8" for="pvLang">Preview ဘာသာ</label>
    <select id="pvLang"><option value="en">English</option><option value="shn">တႆး</option><option value="my">မြန်မာ</option><option value="zh">中文</option><option value="th">ไทย</option></select>
    <button class="b dark" id="pvToggle">Preview ပိတ်/ဖွင့်</button>
    <button class="b dark" id="connectBtn" title="Chrome / Edge only">Folder ချိတ်ရန်</button>
    <button class="b gold" id="saveBtn">သိမ်းရန် (Save)</button>
    <button class="b dark" id="dlBtn">content.js ဒေါင်းရန်</button>
  </div>
  <div class="miss" id="missBar" hidden>
    <span>⚠ <b id="missN">0</b> ပုံ ဒီ folder ရဲ့ <code>img/</code> ထဲမှာ မတွေ့ပါ — ပုံဟောင်းတွေက တခြား folder (ယခင် folder) ထဲမှာ ကျန်နေတာ ဖြစ်နိုင်ပါတယ်။</span>
    <button class="b sm" id="recoverBtn">ယခင် folder ကနေ ပုံတွေ ပြန်ယူရန်</button>
    <span id="fixWrap" hidden><button class="b sm gold" id="fixBtn">စာလုံး အကြီး/အသေး မကိုက်တဲ့ လမ်းကြောင်း <b id="fixN">0</b> ခု ပြင်ရန် (GitHub)</button></span>
    <button class="b sm" id="recheckBtn">ပြန်စစ်ရန်</button>
    <span id="dropMissWrap"><button class="b sm danger" id="dropMissAsk">မတွေ့တဲ့ပုံတွေကို စာရင်းကဖယ်ရန်</button></span>
    <details><summary>မတွေ့တဲ့ ဖိုင်စာရင်း</summary><div id="missList"></div></details>
  </div>
  <div class="main" id="main">
    <nav class="rail" id="rail"></nav>
    <section class="panel" id="panel"></section>
    <aside class="preview"><div class="pv-bar">Live preview · ပြင်တာ ချက်ချင်းမြင်ရ</div><iframe id="pv" src="index.html" title="Website preview"></iframe></aside>
  </div>
</div>
<input type="file" id="filePick" accept="image/*" hidden>
<script src="content.js"></script>

function cleanPath(v){if(typeof v!=="string"||v.startsWith("data:")||/^https?:/i.test(v))return v;

  return site}

/* image picking + resize */
function pickImages(multiple,maxSide=2000){return new Promise(res=>{const f=$("#filePick");f.multiple=!!multiple;f.value="";
  f.onchange=async()=>{const out=[];for(const file of f.files){try{out.push(await resize(file,maxSide))}catch(e){toast("ပုံဖွင့်မရပါ: "+file.name,1)}}res(out)};f.click()})}
function resize(file,maxSide){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const sc=Math.min(1,maxSide/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.86))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* inline two-step delete (no browser confirm dialog) */
const pending=new Set();const openSet=new Set();
function confirmBtn(id,act,i,label){return pending.has(id)?`<span class="confirm">သေချာလား? <button class="b sm danger" data-act="${act}" data-i="${i}">ဖျက်မည်</button><button class="b sm" data-cancel="${id}">မဖျက်ပါ</button></span>`:`<button class="b sm danger" data-ask="${id}">${label}</button>`}

/* ---------- events ---------- */
$("#rail").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;$("#panel").scrollTop=0;render();$("#panel").scrollTop=0}});
$("#panel").addEventListener("input",e=>{const p=e.target.dataset.p;if(!p)return;let v=e.target.value;if(e.target.type==="number"||e.target.type==="range")v=+v||0;if(e.target.type==="range"){const o=$("#opv");if(o)o.textContent=Math.round(v*100)+"%"}setP(p,v);markDirty();
  const sp=e.target.parentElement.querySelector("span");if(sp&&sp.parentElement.classList.contains("lf")&&p.split(".").length>2){const has=!!v;sp.classList.toggle("missing",!has);sp.textContent=sp.textContent.replace(" · ဗလာ","")+(has?"":" · ဗလာ")}});
$("#panel").addEventListener("change",e=>{if(e.target.tagName==="SELECT"&&e.target.dataset.p){setP(e.target.dataset.p,e.target.value);markDirty()}});
$("#panel").addEventListener("toggle",e=>{const d=e.target;if(d.dataset?.key){d.open?openSet.add(d.dataset.key):openSet.delete(d.dataset.key)}},true);
$("#panel").addEventListener("click",async e=>{
  const chip=e.target.closest("[data-lang]");if(chip){langFilter=chip.dataset.lang;render();return}
  const ask=e.target.closest("[data-ask]");if(ask){e.preventDefault();pending.add(ask.dataset.ask);render();return}
  const can=e.target.closest("[data-cancel]");if(can){e.preventDefault();pending.delete(can.dataset.cancel);render();return}
  const im=e.target.closest("[data-img]");if(im){e.preventDefault();const p=im.dataset.img;const [d]=await pickImages(false,p==="images.hero"?2200:1600);if(d){setP(p,d);markDirty();render()}return}
  const a=e.target.closest("[data-act]");if(!a)return;e.preventDefault();
  const i=+a.dataset.i,k=+a.dataset.k,C=SITE.categories;
  const mv=(arr,x,y)=>{if(y<0||y>=arr.length)return;[arr[x],arr[y]]=[arr[y],arr[x]]};
  switch(a.dataset.act){
    case"phAdd":{const ds=await pickImages(true,1800);if(!ds.length)return;C[i].photos.push(...ds);if(!C[i].cover)C[i].cover=ds[0];openSet.add("c"+i);toast(ds.length+" ပုံ ထည့်ပြီးပါပြီ");break}
    case"phLeft":mv(C[i].photos,k,k-1);break;
    case"phRight":mv(C[i].photos,k,k+1);break;
    case"phCover":C[i].cover=C[i].photos[k];break;
    case"phDel":{const [r]=C[i].photos.splice(k,1);if(C[i].cover===r)C[i].cover=C[i].photos[0]||"";break}
    case"catUp":mv(C,i,i-1);openSet.clear();break;
    case"catDown":mv(C,i,i+1);openSet.clear();break;
    case"delCat":C.splice(i,1);pending.delete("cat"+i);openSet.clear();break;
    case"addCat":C.push({id:"cat-"+Date.now(),cover:"",name:{...per(),en:"New Category",my:"အမျိုးအစား အသစ်"},photos:[]});openSet.add("c"+(C.length-1));break;
    case"addPost":SITE.posts.unshift({img:SITE.images.hero||"",date:new Date().toISOString().slice(0,10),minutes:3,tag:per(),title:{...per(),en:"New story",my:"ဆောင်းပါး အသစ်"},body:per()});openSet.clear();openSet.add("p0");break;
    case"delPost":SITE.posts.splice(i,1);pending.delete("post"+i);openSet.clear();break;
    case"addStat":SITE.stats.push({value:"10+",icon:"cam",label:per()});break;
    case"pkUp":mv(SITE.packages.items,i,i-1);openSet.clear();break;
    case"pkDown":mv(SITE.packages.items,i,i+1);openSet.clear();break;
    case"delPk":SITE.packages.items.splice(i,1);pending.delete("pk"+i);openSet.clear();break;
    case"addPk":SITE.packages.items.push({img:"",price:"",name:{...per(),en:"New Package",my:"ပက်ကေ့ချ် အသစ်"},features:per()});openSet.add("k"+(SITE.packages.items.length-1));break;
    case"pkBgClear":SITE.packages.bg="";break;
    case"delStat":SITE.stats.splice(i,1);pending.delete("stat"+i);break;
  }
  markDirty();render()});

function parseContent(txt){const a=txt.indexOf("{"),b=txt.lastIndexOf("}");return JSON.parse(txt.slice(a,b+1))}
$("#connectBtn").addEventListener("click",async()=>{
  if(!window.showDirectoryPicker){toast("ဒီ browser မှာ Folder ချိတ်လို့ မရပါ။ Chrome/Edge သုံးပါ သို့မဟုတ် 'content.js ဒေါင်းရန်' ကို သုံးပါ။",1);return}
  try{const h=await window.showDirectoryPicker({mode:"readwrite"});
    let txt;try{txt=await (await (await h.getFileHandle("content.js")).getFile()).text()}catch(e){toast("ဒီ folder ထဲမှာ content.js မရှိပါ။ Website folder ကို ရွေးပါ။",1);return}
    dirHandle=h;if(!dirty){try{SITE=normalize(parseContent(txt));render();sendPreview()}catch(e){}}
    $("#connectBtn").textContent="Folder: "+h.name;checkMissing();toast("Folder ချိတ်ပြီးပါပြီ။ Save နှိပ်ရင် ဒီ folder ထဲ တိုက်ရိုက်သိမ်းပါမယ်။")
  }catch(e){if(e.name!=="AbortError")toast("Folder ချိတ်မရပါ: "+e.message,1)}});
async function dataUrlToBlob(u){return await (await fetch(u)).blob()}
$("#saveBtn").addEventListener("click",async()=>{
  if(!dirHandle){if(window.showDirectoryPicker){toast("ပထမဆုံး 'Folder ချိတ်ရန်' ကိုနှိပ်ပါ။ (သို့မဟုတ် content.js ဒေါင်းရန် ကို သုံးပါ)",1)}else downloadContent();return}
  const btn=$("#saveBtn");btn.disabled=true;btn.textContent="သိမ်းနေသည်…";
  try{
    const imgDir=await dirHandle.getDirectoryHandle("img",{create:true});
    const stamp=new Date().toISOString().replace(/[-:T]/g,"").slice(0,14);let n=0;
    const walk=async(o)=>{for(const k in o){const v=o[k];
      if(typeof v==="string"&&v.startsWith("data:image")){const name=`u-${stamp}-${++n}.jpg`;const fh=await imgDir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(await dataUrlToBlob(v));await w.close();
        const path="img/"+name;replaceAll(SITE,v,path)}
      else if(v&&typeof v==="object")await walk(v)}};
    await walk(SITE);
    // backup old content.js
    try{const old=await (await (await dirHandle.getFileHandle("content.js")).getFile()).text();const bd=await dirHandle.getDirectoryHandle("backups",{create:true});const bf=await bd.getFileHandle(`content-${stamp}.js`,{create:true});const bw=await bf.createWritable();await bw.write(old);await bw.close()}catch(e){}
    const fh=await dirHandle.getFileHandle("content.js",{create:true});const w=await fh.createWritable();await w.write(serialize());await w.close();
    dirty=false;const s=$("#status");s.textContent="သိမ်းပြီးပါပြီ "+new Date().toLocaleTimeString();s.className="status saved";
    toast("သိမ်းပြီးပါပြီ"+(n?` · ပုံအသစ် ${n} ပုံ img/ ထဲ ထည့်ပြီး`:""));render();sendPreview();
  }catch(e){toast("သိမ်းမရပါ: "+e.message,1)}
  btn.disabled=false;btn.textContent="သိမ်းရန် (Save)"});
function replaceAll(o,from,to){for(const k in o){if(o[k]===from)o[k]=to;else if(o[k]&&typeof o[k]==="object")replaceAll(o[k],from,to)}}
function downloadContent(){const blob=new Blob([serialize()],{type:"text/javascript"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="content.js";document.body.appendChild(a);a.click();a.remove();
  const mb=(blob.size/1048576).toFixed(1);toast(`content.js (${mb} MB) ဒေါင်းပြီးပါပြီ။ Website folder ထဲက content.js ကို အစားထိုးပါ။`);dirty=false;const s=$("#status");s.textContent="ဒေါင်းပြီး";s.className="status saved"}
$("#dlBtn").addEventListener("click",downloadContent);
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();$("#saveBtn").click()}});
/* ---------- missing-image check & recovery ---------- */
document.addEventListener("error",e=>{if(e.target.tagName==="IMG")e.target.classList.add("broken")},true);
function allImagePaths(){const out=new Set();const walk=o=>{for(const k in o){const v=o[k];if(typeof v==="string"&&/^img\/[^/]+$/i.test(v))out.add(v);else if(v&&typeof v==="object")walk(v)}};walk(SITE);return [...out]}
function probe(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=src+"?t="+Date.now()})}
let missing=[],fixes=[];
async function checkMissing(){
  const paths=allImagePaths();const res=[];fixes=[];
  if(dirHandle){let img=null;try{img=await dirHandle.getDirectoryHandle("img")}catch(e){}
    const names=new Map();if(img){for await(const [n,h] of img.entries()){if(h.kind==="file")names.set(n.toLowerCase(),n)}}
    fixes=[];for(const p of paths){const n=p.slice(4);if(names.has(n.toLowerCase())&&names.get(n.toLowerCase())===n)continue;
      const real=names.get(n.toLowerCase())||names.get(decodeURIComponent(n).toLowerCase());if(real)fixes.push([p,"img/"+real]);else res.push(p)}}
  else{for(const p of paths){if(!(await probe(p)))res.push(p)}}
  missing=res;$("#missBar").hidden=!res.length&&!fixes.length;$("#fixWrap").hidden=!fixes.length;$("#fixN").textContent=fixes.length;$("#missN").textContent=res.length;
  $("#missList").innerHTML=res.map(x=>`<code>${esc(x)}</code>`).join("");
  $("#dropMissWrap").innerHTML='<button class="b sm danger" id="dropMissAsk">မတွေ့တဲ့ပုံတွေကို စာရင်းကဖယ်ရန်</button>';
  return res}
$("#fixBtn").addEventListener("click",async()=>{const n=fixes.length;fixes.forEach(([a,b])=>replaceAll(SITE,a,b));markDirty();await checkMissing();render();toast(`လမ်းကြောင်း ${n} ခု ပြင်ပြီး · Save နှိပ်ပါ`)});
$("#recheckBtn").addEventListener("click",async()=>{const r=await checkMissing();toast(r.length?`ပုံ ${r.length} ပုံ မတွေ့သေးပါ`:"ပုံအားလုံး တွေ့ပါပြီ ✓");render();sendPreview();reloadPreview()});
function reloadPreview(){try{$("#pv").contentWindow.location.reload()}catch(e){}}
$("#recoverBtn").addEventListener("click",async()=>{
  if(!window.showDirectoryPicker){toast("Chrome / Edge လိုပါတယ်",1);return}
  if(!dirHandle){toast("ပထမဆုံး 'Folder ချိတ်ရန်' နဲ့ လက်ရှိ website folder ကို ချိတ်ပါ",1);return}
  toast("ပုံဟောင်းတွေရှိတဲ့ ယခင် website folder (သို့) အဲ့ဒီ img folder ကို ရွေးပါ");
  let src;try{src=await window.showDirectoryPicker({mode:"read"})}catch(e){return}
  let srcImg=src;try{srcImg=await src.getDirectoryHandle("img")}catch(e){}
  const dst=await dirHandle.getDirectoryHandle("img",{create:true});let n=0,miss=0;
  for(const p of missing){const name=p.slice(4);try{const f=await (await srcImg.getFileHandle(name)).getFile();const w=await (await dst.getFileHandle(name,{create:true})).createWritable();await w.write(f);await w.close();n++}catch(e){miss++}}
  await checkMissing();render();reloadPreview();
  toast(`ပုံ ${n} ပုံ ပြန်ယူပြီးပါပြီ`+(miss?` · ${miss} ပုံ အဲ့ဒီ folder မှာလည်း မရှိပါ`:""),miss&&!n)});
document.addEventListener("click",e=>{
  if(e.target.id==="dropMissAsk"){$("#dropMissWrap").innerHTML='<span class="confirm">သေချာလား? <button class="b sm danger" id="dropMissDo">ဖယ်မည်</button><button class="b sm" id="dropMissNo">မဖယ်ပါ</button></span>'}
  if(e.target.id==="dropMissNo")checkMissing();
  if(e.target.id==="dropMissDo"){const M=new Set(missing);
    const clean=o=>{for(const k in o){const v=o[k];if(Array.isArray(v)){for(let i=v.length-1;i>=0;i--){if(typeof v[i]==="string"&&M.has(v[i]))v.splice(i,1);else if(v[i]&&typeof v[i]==="object")clean(v[i])}}
      else if(typeof v==="string"&&M.has(v))o[k]="";else if(v&&typeof v==="object")clean(v)}};
    clean(SITE);(SITE.categories||[]).forEach(c=>{if(!c.cover)c.cover=c.photos[0]||""});
    markDirty();checkMissing();render();toast("ဖယ်ပြီးပါပြီ။ Save နှိပ်ပြီး သိမ်းပါ")}
});
if(!window.SITE){$("#panel").innerHTML='<div class="group"><b>content.js ကို ရှာမတွေ့ပါ။</b> admin.html ကို website folder ထဲကနေ ဖွင့်ပါ။</div>'}else{render();setTimeout(checkMissing,400)}
</script>
</body>
</html>
